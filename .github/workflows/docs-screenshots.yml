# Screenshot regeneration pipeline (two capture sets, one dispatch type).
#
# Two dispatch-driven jobs regenerate the docs screenshots under
# images/studio/*.png and each opens its own self-merging regeneration PR
# (regen-automerge.yml auto-merges any docs/regenerate-* branch):
#
#   studio -- boots a docs-demo skeleton, builds the Studio SPA, and drives
#     tai-studio/e2e/scripts/docs-screenshots.sh to capture the Studio screens.
#   editor -- boots the flow-editor stack (the same backend the engine's own
#     browser e2e job provides) against the Studio SPA shell, runs the
#     docs-bound screenshot sweep, asserts the captured set matches the images
#     the flow-author pages embed, then copies that set in.
#
# Both jobs write disjoint filenames, so their PRs never collide.
#
# Triggers: manual (workflow_dispatch, which runs BOTH jobs) and a single
# repository_dispatch fired by the notify-docs-screenshots hooks in the Studio
# and engine repos, each ONLY when its UI paths change. The jobs branch on a
# neutral `set` payload field, never on a source repo name: the engine hook
# sends `set: editor` (editor job only); an absent field is the Studio default
# (Studio job) -- true for the Studio hook and for a manual dispatch.
#
# Secrets: TAI_CI_TOKEN (clone the private source repos) and TAI_DOCS_PR_TOKEN
# (open the PR as a PAT so the PR triggers the docs `gate`, unlike GITHUB_TOKEN).
#
# NOTE on churn: the shots embed live demo data (seeded IDs, counters). The demo
# seed is pinned (fixed tokens/fingerprints in boot.sh). Regeneration PRs
# self-merge, so watch merged regen PRs: image diffs that are only noise (a
# timestamp, a counter) rather than a real UI change mean the seed needs further
# pinning.
#
# Every source-clone target is a repository variable with the first-party value
# as its default, so a fork builds against its own repos by setting the
# variables and needs no code change. A fork has neither TAI_CI_TOKEN nor
# TAI_DOCS_PR_TOKEN, and the source notify hooks self-skip without their own
# dispatch token, so the pipeline never fires there.

name: docs-screenshots

on:
  workflow_dispatch:
  repository_dispatch:
    types: [studio-screenshots] # fired by the Studio and engine notify hooks on UI-path pushes to main

permissions:
  contents: read

env:
  SOURCE_REF: main

jobs:
  studio:
    # An absent `set` is the Studio default: a manual dispatch (null payload) and
    # the Studio hook both run this job; the engine's `set: editor` skips it.
    if: github.event.client_payload.set != 'editor'
    runs-on: ubuntu-latest
    # Independent from the editor group so an editor dispatch never cancels an
    # in-flight Studio capture; a burst from the Studio source still collapses to
    # one run, which recaptures from source `main` HEAD onto the fixed branch.
    concurrency:
      group: docs-screenshots-studio
      cancel-in-progress: true
    permissions:
      contents: write # push the regeneration branch
      pull-requests: write # open the automated PR
    steps:
      - name: Check out tai-docs
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: tai-docs

      - name: Check out source repositories
        # docs-screenshots.sh resolves the monorepo and Studio SPA as siblings of the
        # tai-docs checkout (../tai42, ../tai-studio), so they are cloned into those
        # fixed local directory names regardless of the source repo names. The
        # monorepo carries the skeleton (core/skeleton) plus every plugin boot.sh
        # installs into the workspace venv; its `[tool.uv.sources]` floats the
        # workspace members editable, so `uv sync` needs the tree on disk. The
        # monorepo may be private, so authenticate via a git url.insteadOf rewrite
        # with TAI_CI_TOKEN.
        env:
          TAI_CI_TOKEN: ${{ secrets.TAI_CI_TOKEN }}
          SOURCE_OWNER: ${{ vars.SOURCE_REPO_OWNER || github.repository_owner }}
          MONOREPO_REPO: ${{ vars.MONOREPO_REPO || 'tai42' }}
          STUDIO_REPO: ${{ vars.STUDIO_REPO || 'tai-studio' }}
        run: |
          git config --global \
            url."https://x-access-token:${TAI_CI_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          git clone --depth 1 --branch "$SOURCE_REF" \
            "https://github.com/${SOURCE_OWNER}/${MONOREPO_REPO}.git" tai42
          git clone --depth 1 --branch "$SOURCE_REF" \
            "https://github.com/${SOURCE_OWNER}/${STUDIO_REPO}.git" tai-studio
          # The source-clone credential rewrite is global; create-pull-request pushes
          # to tai-docs with its own TAI_DOCS_PR_TOKEN, which takes precedence.

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.26"
          enable-cache: true

      - run: uv python install 3.13

      - name: Sync the skeleton env (the backend the boot recipe runs)
        working-directory: tai42/core/skeleton
        run: uv sync --locked --python 3.13 --extra dev

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tai-studio/pnpm-lock.yaml

      - name: Install JS deps
        working-directory: tai-studio
        run: pnpm install --frozen-lockfile

      - name: Build the Studio workspace packages
        # Build ALL workspace packages so their gitignored dist/ output is fresh
        # before the SPA bundles them -- a source change left unbuilt would be
        # silently absent from the captured shots. The SPA (studio-app) and the
        # docs-demo reference plugin are (re)built by boot.sh below, from these
        # fresh package dists; SKIP_SPA_BUILD is deliberately NOT set, since it would
        # also skip the reference-plugin build (@tai42/e2e has no plain `build`).
        working-directory: tai-studio
        run: pnpm -r build

      - name: Install the Playwright browser
        working-directory: tai-studio
        run: pnpm --filter @tai42/e2e exec playwright install --with-deps chromium

      - name: Regenerate the Studio screenshots
        working-directory: tai-studio
        # docs-screenshots.sh builds the SPA + reference plugin (from the fresh
        # package dists above), boots a docs-demo skeleton (docker brings up its own
        # loopback Redis + Postgres -- both preinstalled on ubuntu-latest), seeds the
        # demo, and captures every screen into ../tai-docs/images/studio, failing
        # (never shipping a broken shot) if a screen does not render. One retry absorbs
        # a transient Playwright/boot flake.
        #
        # SKIP_NONDETERMINISTIC_SHOTS skips the QR screens, whose QR encodes a freshly-
        # minted random token each run and would otherwise churn every regeneration;
        # they are recaptured only on a manual full run when their dialog UI changes.
        env:
          SKIP_NONDETERMINISTIC_SHOTS: "1"
        run: |
          set -o pipefail
          cleanup() {
            pkill -f "tai serve" 2>/dev/null || true
            docker ps -aq --filter "name=tai-studio-e2e" | xargs -r docker rm -f
            docker network rm tai-studio-e2e_default 2>/dev/null || true
          }
          if ! bash e2e/scripts/docs-screenshots.sh; then
            echo "::warning::first screenshot attempt failed -- cleaning up and retrying once"
            cleanup
            bash e2e/scripts/docs-screenshots.sh
          fi

      - name: Open an automated PR when a screenshot changed
        # Never pushes to main; a differing capture lands as a bot PR that
        # self-merges once the required checks pass (regen-automerge.yml). A no-op
        # when nothing changed.
        #
        # `token` is TAI_DOCS_PR_TOKEN (a PAT), NOT GITHUB_TOKEN: a PR opened with
        # GITHUB_TOKEN does not trigger further workflows, so the docs `gate` (link
        # check) would never run on the regen PR.
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.TAI_DOCS_PR_TOKEN }}
          path: tai-docs
          branch: docs/regenerate-screenshots
          commit-message: "docs: regenerate Studio screenshots"
          title: "docs: regenerate Studio screenshots"
          body: |
            Automated regeneration of the Studio docs screenshots
            (`images/studio/*.png`) from the Studio repo's `main` UI.

            Self-merges once the required checks pass. If the only image diffs
            are noise (a timestamp or a counter) rather than a real UI change,
            the docs-demo seed needs further pinning.
          labels: documentation, automated, screenshots
          delete-branch: true

  editor:
    # The engine hook sends `set: editor`; a manual dispatch runs this job too.
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.set == 'editor'
    runs-on: ubuntu-latest
    # Independent from the Studio group (see the Studio job's note): an editor
    # burst collapses to one run without ever cancelling a Studio capture.
    concurrency:
      group: docs-screenshots-editor
      cancel-in-progress: true
    permissions:
      contents: write # push the regeneration branch
      pull-requests: write # open the automated PR
    # The flow-editor sweep boots the engine's studio stack; provide the same
    # backend the engine's own browser e2e job provides.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 20
      redis-checkpoint:
        # Module-capable Redis the studio stack the Playwright webServer boots
        # checkpoints against.
        image: redis:8
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 3s --health-retries 20
    env:
      TAI_E2E_REDIS_URL: redis://localhost:6379
      TAI_E2E_PG_HOST: localhost
      TAI_E2E_PG_PASSWORD: postgres
      TAI_E2E_CHECKPOINT_REDIS_URL: redis://localhost:6380
    steps:
      - name: Check out tai-docs
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: tai-docs

      - name: Check out source repositories
        # The engine is private, so authenticate via a git url.insteadOf rewrite with
        # TAI_CI_TOKEN; the Studio SPA is the shell that hosts the flow editor. Both
        # are cloned into fixed local directory names regardless of the source repo
        # names.
        env:
          TAI_CI_TOKEN: ${{ secrets.TAI_CI_TOKEN }}
          SOURCE_OWNER: ${{ vars.SOURCE_REPO_OWNER || github.repository_owner }}
          ENGINE_REPO: ${{ vars.ENGINE_REPO || 'babelfish' }}
          STUDIO_REPO: ${{ vars.STUDIO_REPO || 'tai-studio' }}
        run: |
          git config --global \
            url."https://x-access-token:${TAI_CI_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          git clone --depth 1 --branch "$SOURCE_REF" \
            "https://github.com/${SOURCE_OWNER}/${ENGINE_REPO}.git" engine
          git clone --depth 1 --branch "$SOURCE_REF" \
            "https://github.com/${SOURCE_OWNER}/${STUDIO_REPO}.git" studio
          # The source-clone credential rewrite is global; create-pull-request pushes
          # to tai-docs with its own TAI_DOCS_PR_TOKEN, which takes precedence.

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.26"
          enable-cache: true

      - run: uv python install 3.13

      - name: Sync the engine env (the studio stack the webServer boots)
        # The Playwright webServer boots `.venv/bin/tai42-e2e-studio-stack` from the
        # engine root, so the browser sweep needs the engine's python workspace.
        working-directory: engine
        run: uv sync --locked --python 3.13

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22

      - name: Build the Studio SPA
        # Build all workspace packages so the SPA bundle the stack serves is fresh;
        # TAI_E2E_STUDIO_DIST_PATH points the stack at that dist.
        working-directory: studio
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
          echo "TAI_E2E_STUDIO_DIST_PATH=$PWD/apps/studio/dist" >> "$GITHUB_ENV"

      - name: Build the flow-editor bundle
        # Rebuild rather than trust the committed dist so a stale bundle never slips
        # through and the sweep captures the freshly built editor.
        working-directory: engine/packages/flows
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install the browser-suite workspace
        working-directory: engine/e2e/ui
        run: pnpm install --frozen-lockfile

      - name: Install the Playwright browser
        working-directory: engine/e2e/ui
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture the editor docs screenshots
        # The `@docs`-tagged sweep writes each `<key>-<theme>.png` into SHOTS_OUT, a
        # clean staging dir outside the docs tree. A shot that does not render fails
        # the run; one retry (from a cleared dir) absorbs a transient flake, and a
        # second failure fails the job before any copy, so a partial set is never
        # published.
        working-directory: engine/e2e/ui
        env:
          SHOTS_OUT: ${{ runner.temp }}/editor-shots
        run: |
          set -o pipefail
          capture() {
            rm -rf "$RUNNER_TEMP/editor-shots"
            mkdir -p "$RUNNER_TEMP/editor-shots"
            pnpm exec playwright test --project=chromium --grep "@docs"
          }
          if ! capture; then
            echo "::warning::first editor screenshot attempt failed -- retrying once"
            capture
          fi

      - name: Assert editor-shot parity with the flow-author pages
        # Bijection between the staged shots and the images the flow-author pages
        # embed: a page embed with no staged shot, or a staged shot no page embeds,
        # fails here -- before any copy -- so the copied set equals the embedded set
        # exactly.
        run: |
          python3 tai-docs/scripts/check_editor_shots.py \
            --shots-dir "$RUNNER_TEMP/editor-shots" \
            --pages-root tai-docs/babelfish

      - name: Copy the editor screenshots into the docs tree
        # The parity step has proven the staged set equals the embedded set; the
        # editor filenames are disjoint from the Studio set, so this never collides.
        run: |
          mkdir -p tai-docs/images/studio
          cp "$RUNNER_TEMP"/editor-shots/*.png tai-docs/images/studio/

      - name: Open an automated PR when a screenshot changed
        # Never pushes to main; a differing capture lands as a bot PR that
        # self-merges once the required checks pass (regen-automerge.yml). A no-op
        # when nothing changed.
        #
        # `token` is TAI_DOCS_PR_TOKEN (a PAT), NOT GITHUB_TOKEN: a PR opened with
        # GITHUB_TOKEN does not trigger further workflows, so the docs `gate` (link
        # check) would never run on the regen PR.
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.TAI_DOCS_PR_TOKEN }}
          path: tai-docs
          branch: docs/regenerate-editor-screenshots
          commit-message: "docs: regenerate flow-editor screenshots"
          title: "docs: regenerate flow-editor screenshots"
          body: |
            Automated regeneration of the flow-editor docs screenshots
            (`images/studio/*.png`) from the engine's `main` UI.

            Self-merges once the required checks pass. If the only image diffs
            are noise (a timestamp or a counter) rather than a real UI change,
            the demo seed needs further pinning.
          labels: documentation, automated, screenshots
          delete-branch: true
