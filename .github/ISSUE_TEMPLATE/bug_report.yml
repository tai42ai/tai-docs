name: Documentation issue
description: Report a problem with the tai42.ai documentation (wrong, broken, or missing content)
labels: ["docs"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: URL or file path of the affected page.
      placeholder: "https://tai42.ai/concepts/..."
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong, broken, or missing, and what did you expect to see?
    validations:
      required: true
