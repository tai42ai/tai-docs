#| validate: manifest
# Enable the ready-made agents. Each agent lives in its own module, and importing
# a module is what registers its agent — so name one agents[] entry per module
# (naming the top-level `tai_agents` package alone registers nothing). Add the
# agents router to drive runs over SSE.
agents:
  - title: tools-agent
    module: tai_agents.tools_agent
  - title: deep-agent
    module: tai_agents.deep_agent
  - title: retrieval-tools-agent
    module: tai_agents.retrieval_tools_agent
  - title: mcp-tools-agent
    module: tai_agents.mcp_tools_agent
  - title: voting-agent
    module: tai_agents.voting_agent
  - title: refine-agent
    module: tai_agents.refine_agent
  - title: vqa-agent
    module: tai_agents.vqa_agent
routers_modules:
  - tai_skeleton.routers.agents
