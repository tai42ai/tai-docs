[project]
name = "tai-docs"
version = "0.2.0"
description = "Reference generators and freshness checks for the tai documentation site."
requires-python = ">=3.13"

# tai-docs is a Mintlify site, not a distributable package; it ships no runtime
# package of its own. This file gives the generators and checks under `scripts/`
# a ruff/pytest home. The `dev` group installs pytest plus the packages the
# scripts import; `[tool.uv.sources]` points those at the `tai42` monorepo's
# members in a sibling checkout — a standalone clone installs the same group from
# the registry with `--no-sources` instead (see CONTRIBUTING.md). CI runs the
# suite from the monorepo skeleton's own environment
# (`uv run pytest ../../../tai-docs`).

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "griffe>=1",
    "PyYAML>=6.0",
    # These dev deps resolve from the editable sibling sources named in
    # [tool.uv.sources] below; the specifiers state the compatible ranges (a
    # standalone clone installs the same ranges from the registry with --no-sources).
    "tai42-skeleton>=21,<22",
    "tai42-contract>=15,<16",
    "tai42-kit[llm,jq,uvicorn,redis,postgres]>=7,<8",
    "tai42-identity-redis>=2,<3",
]

[tool.uv.sources]
tai42-skeleton = { path = "../tai42/core/skeleton", editable = true }
tai42-contract = { path = "../tai42/core/contract", editable = true }
tai42-kit = { path = "../tai42/core/kit", editable = true }
tai42-cli = { path = "../tai42/core/cli", editable = true }
tai42-identity-redis = { path = "../tai42/plugins/identity-redis", editable = true }

[tool.pytest.ini_options]
testpaths = ["scripts"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["scripts"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "PIE",
    "PT",
    "RUF",
    "C901",
    "PLR0912",
    "PLR0915",
    "N",
    "A",
    "ARG",
    "RET",
    "PERF",
    "FURB",
    "ERA",
    "S",
    "TRY",
    "T20",
    "D",
]
ignore = [
    # TRY003 forbids messages built at the raise site, whose only satisfying fix
    # is a bespoke exception subclass per raise. These generators raise with
    # context-rich messages (the offending file, field, or command) that belong
    # at the call site; subclass-per-message adds no correctness.
    "TRY003",
]

[tool.ruff.lint.pydocstyle]
# Public API only: the D1xx public-symbol rules already skip underscore-private
# names; tests are exempted below. Google style matches the repo's docstrings.
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Complexity and unused-argument rules are source-only: tests carry fixtures and
# scaffolding that these rules would flag without a defect being present. Tests
# also use bare asserts (S101) and need no public-API docstrings (D).
"**/test_*.py" = ["C901", "PLR0912", "PLR0915", "ARG", "S101", "D"]
"**/*_test.py" = ["C901", "PLR0912", "PLR0915", "ARG", "S101", "D"]
"**/conftest.py" = ["C901", "PLR0912", "PLR0915", "ARG", "S101", "D"]
# The top-level scripts are CLIs, generators, and drift checks whose stdout is
# their interface; they print by design. The studio_sdk_ref library package is
# kept guarded so future non-script code stays print-free.
"scripts/*.py" = ["T201"]
